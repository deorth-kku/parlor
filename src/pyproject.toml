[project]
name = "parlor"
version = "0.1.0"
description = "Real-time multimodal AI — voice + vision conversations with an OpenAI-compatible backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.43.0",
    "websockets>=16.0",
    "python-dotenv>=1.0.0",
]

# Only needed by src/benchmarks/bench.py; keep the runtime env lean.
[dependency-groups]
dev = [
    "numpy>=2.4.4",
    "pillow>=11.0.0",
]
